<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f1e7" />
  <title>Dankjewel — Robbert & Mellanie</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thanks{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px;background:radial-gradient(circle at top,#fffaf2 0,#f7f1e7 66%)}
    .thanks-card{max-width:680px;background:#fffaf2;border:1px solid #ded1bd;border-radius:32px;padding:54px 38px;box-shadow:0 22px 55px rgba(65,49,32,.12)}
    .thanks-card h1{font-family:Georgia,serif;color:#3f4d40;font-weight:400;font-size:56px;margin:0 0 14px}
    .thanks-card p{color:#746f67}.thanks-logo{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto -2px}.thanks-card .button{margin-top:18px}
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-card">
      <img class="thanks-logo" src="assets/rm-monogram.png" alt="Robbert & Mellanie" />
      <p class="eyebrow">RSVP ontvangen</p>
      <h1>Dankjewel!</h1>
      <p>Fijn dat je het hebt laten weten. We kijken uit naar een onvergetelijke dag samen.</p>
      <a class="button button-primary" href="index.html">Terug naar de website</a>
    </div>
  </main>
</body>
</html>
